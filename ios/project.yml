# XcodeGen spec. The .xcodeproj is generated in CI (never committed).
#   xcodegen generate  ->  MyCoffee.xcodeproj
name: MyCoffee
options:
  bundleIdPrefix: ro.climbagain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"        # bump forward every release or TestFlight won't auto-update
    CURRENT_PROJECT_VERSION: "1"      # overridden per build by fastlane (minute timestamp)
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Manual
targets:
  MyCoffee:
    type: application
    platform: iOS
    sources:
      - MyCoffee/Sources
      - MyCoffee/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.climbagain.mycoffee
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MyCoffee/Info.plist
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
