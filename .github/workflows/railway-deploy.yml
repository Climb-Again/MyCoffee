name: Deploy backend (Railway)

# Token-based deploy so pushes auto-deploy regardless of commit author.
# Railway's native GitHub trigger gates commits from authors who aren't on the
# Railway team (e.g. the automation identity), parking them on "Needs approval".
# This deploys via a Railway token from CI instead — no member seat required.
#
# Setup: repo secret RAILWAY_TOKEN = a Railway *project* token (Project → Settings
# → Tokens), scoped to the production environment. Disconnect the service's native
# GitHub branch trigger so only this workflow deploys (no more approval prompts).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # backend/src/data/whatsnew.json is GENERATED from status/BACKLOG.md
      # (ops/gen-whatsnew-plan.mjs), so as of 2026-09-11 every lane that flips
      # a backlog row rewrites a file under backend/. Without this negation
      # each row flip would trigger a full redeploy — and a redeploy SIGTERMs a
      # running extraction worker (CLAUDE.md §12), which is exactly the thing
      # the "never push backend/** while a job is running" rule exists to stop.
      # Path filters evaluate in order, so this excludes a push that touches
      # ONLY that file; a push that also changes real backend code still
      # deploys and carries the newest plan with it.
      # Cost of the negation: the DEPLOYED plan lags the repo by at most one
      # backend deploy (the backend lane runs Mon/Wed/Fri). That is a bounded,
      # self-correcting lag, versus the unbounded 15-day staleness this whole
      # mechanism replaced.
      - "!backend/src/data/whatsnew.json"
      - ".github/workflows/railway-deploy.yml"
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # Run from the REPO ROOT (not backend/): `railway up` honors the service's
        # Root Directory setting (= "backend"), so it selects backend/ itself.
        # Uploading from backend/ would make it look for backend/backend and fail.
        # Service is named "MyCoffee" (Railway auto-named it after the repo).
        # --ci streams build logs and exits non-zero on failure.
        run: railway up --ci --service MyCoffee
