name: Deploy backend (Railway)

# Token-based deploy so pushes auto-deploy regardless of commit author.
# Railway's native GitHub trigger gates commits from authors who aren't on the
# Railway team (e.g. the automation identity), parking them on "Needs approval".
# This deploys via a Railway token from CI instead — no member seat required.
#
# Setup: repo secret RAILWAY_TOKEN = a Railway *project* token (Project → Settings
# → Tokens), scoped to the production environment. Disconnect the service's native
# GitHub branch trigger so only this workflow deploys (no more approval prompts).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      # backend/src/data/whatsnew.json is GENERATED from status/BACKLOG.md
      # (ops/gen-whatsnew-plan.mjs), so as of 2026-09-11 every lane that flips
      # a backlog row rewrites a file under backend/. Without this negation
      # each row flip would trigger a full redeploy — and a redeploy SIGTERMs a
      # running extraction worker (CLAUDE.md §12), which is exactly the thing
      # the "never push backend/** while a job is running" rule exists to stop.
      # Path filters evaluate in order, so this excludes a push that touches
      # ONLY that file; a push that also changes real backend code still
      # deploys and carries the newest plan with it.
      # Cost of the negation: the DEPLOYED plan lags the repo by at most one
      # backend deploy (the backend lane runs Mon/Wed/Fri). That is a bounded,
      # self-correcting lag, versus the unbounded 15-day staleness this whole
      # mechanism replaced.
      - "!backend/src/data/whatsnew.json"
      - ".github/workflows/railway-deploy.yml"
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    # #174: until this landed, CI ran 325 green tests that exercised no route
    # handler body at all. With no DATABASE_URL/INGEST_TOKEN/APP_TOKEN, every
    # route test asserted `[401, 503]` and only auth.js's `auth_not_configured`
    # branch ever executed — #166's data-loss bug and #168's unstable ETag would
    # each have been caught by one real request.
    #
    # The tokens below are THROWAWAY values that exist only inside this job's
    # container. They are deliberately NOT the repo secrets: the real tokens
    # must never be read by a test job (CLAUDE.md §12 — Actions logs on a public
    # repo are world-readable), and nothing here needs them, because the
    # database is a fresh empty service container.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mycoffee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mycoffee_test
      PGSSL: disable
      INGEST_TOKEN: ci-throwaway-ingest-token
      APP_TOKEN: ci-throwaway-app-token
      # #152: the roaster-logo tests write real bytes. DATA_DIR defaults to
      # `/data` (the Railway volume mount), which is not a path a CI runner
      # should be creating — point it at scratch space instead.
      #
      # A LITERAL path, not a runner.temp expression: the `runner` context does not
      # exist in a job-level `env:` block (only inside steps), and an invalid
      # context there fails WORKFLOW VALIDATION, not the job. Runs 115 and 116
      # died that way — zero jobs, zero duration, and the Actions list showed
      # the file path instead of the workflow's `name:`, which is the tell.
      DATA_DIR: /tmp/mycoffee-ci-data

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Also the only check that every migration still applies to an empty
      # database in filename order — a broken migration used to be discovered
      # by Railway, on production, after the deploy had already started.
      - name: Apply migrations
        run: node src/migrate.js

      - name: Run tests
        run: npm test

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # Run from the REPO ROOT (not backend/): `railway up` honors the service's
        # Root Directory setting (= "backend"), so it selects backend/ itself.
        # Uploading from backend/ would make it look for backend/backend and fail.
        # Service is named "MyCoffee" (Railway auto-named it after the repo).
        # --ci streams build logs and exits non-zero on failure.
        run: railway up --ci --service MyCoffee
