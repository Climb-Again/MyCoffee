name: iOS TestFlight

on:
  # `main` AND `ios-staging`. A push event can only come from someone with write
  # access, so this stays safe on a public repo (the rule that must never be
  # broken is adding `pull_request`/`pull_request_target`, not `push`).
  # Compile-checking ios-staging on every push replaces the old Wed/Sat compile
  # lane routine: feedback lands in ~90s instead of up to four days later, and
  # `publish=true` remains impossible from a push (the upload step is gated on
  # workflow_dispatch).
  push:
    branches: [main, ios-staging]
    paths:
      - "ios/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to TestFlight (false = compile check only)"
        type: boolean
        default: true

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read    # match storage lives in the private repo, not here

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      # match storage is a SEPARATE PRIVATE repo. This repo is public, and an
      # encrypted distribution cert in a public repo is an offline brute-force
      # target. GITHUB_TOKEN can't be used here — it is scoped to this repo only.
      MATCH_GIT_URL: https://x-access-token:${{ secrets.MATCH_PAT }}@github.com/Climb-Again/mycoffee-private.git
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Configure git identity (for match)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # Compile-only on every push to main, and on a publish=false dispatch.
      - name: Compile check (no upload)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == false) }}
        run: |
          xcodegen generate
          xcodebuild build \
            -project MyCoffee.xcodeproj \
            -scheme MyCoffee \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      # TestFlight upload only on an explicit manual/cron publish=true dispatch.
      - name: Build & upload to TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
        run: bundle exec fastlane beta
